
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPilote Day 17 - Cognito Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(360px, calc(100% - 40px));
      padding: 26px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 24px #00000012;
    }
    h1 { font-size: 22px; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 6px;
    }
    input { border: 1px solid #d1d5db; }
    button {
      border: 0;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
    button.secondary { background: #374151; }
    #message { overflow-wrap: anywhere; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>SkillPilote Login</h1>
  <p>Day 17: Amazon Cognito Authentication</p>

  <form id="authForm">
    <input id="email" type="email" placeholder="Email address" required>
    <input id="password" type="password"
           placeholder="Password" minlength="8" required>
    <input id="code" type="text"
           placeholder="Email confirmation code" hidden>

    <button id="signup" type="button">Sign Up</button>
    <button id="signin" type="submit">Sign In</button>
    <button id="confirm" type="button" hidden>
      Confirm Email
    </button>
    <button id="signout" type="button" class="secondary" hidden>
      Sign Out
    </button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
</main>

<script type="module">
  import { Amplify } from
    "https://esm.sh/aws-amplify@6";
  import {
    signUp, confirmSignUp, signIn,
    getCurrentUser, signOut
  } from "https://esm.sh/aws-amplify@6/auth";

  Amplify.configure({
    Auth: {
      Cognito: {
        userPoolId: "ap-south-1_pjX4aCrhi",
        userPoolClientId: "2mc0jko0vqgsigla74iap6emeo",
        loginWith: { email: true }
      }
    }
  });

  const $ = id => document.getElementById(id);
  const message = text => $("message").textContent = text;

  $("signup").onclick = async () => {
    try {
      const result = await signUp({
        username: $("email").value.trim(),
        password: $("password").value,
        options: {
          userAttributes: { email: $("email").value.trim() }
        }
      });

      if (result.nextStep.signUpStep ===
          "CONFIRM_SIGN_UP") {
        $("code").hidden = false;
        $("confirm").hidden = false;
        message("Enter the confirmation code sent to your email.");
      } else {
        message("Sign-up step: " + result.nextStep.signUpStep);
      }
    } catch (error) {
      message(error.message || "Sign-up failed.");
    }
  };

  $("confirm").onclick = async () => {
    try {
      await confirmSignUp({
        username: $("email").value.trim(),
        confirmationCode: $("code").value.trim()
      });
      message("Email confirmed. You can now sign in.");
    } catch (error) {
      message(error.message || "Confirmation failed.");
    }
  };

  $("authForm").onsubmit = async event => {
    event.preventDefault();
    try {
      const result = await signIn({
        username: $("email").value.trim(),
        password: $("password").value
      });

      if (result.isSignedIn) {
        const user = await getCurrentUser();
        message("Signed in successfully: " + user.username);
        $("signout").hidden = false;
      } else {
        message("Additional sign-in step required: " +
          result.nextStep.signInStep);
      }
    } catch (error) {
      message(error.message || "Sign-in failed.");
    }
  };

  $("signout").onclick = async () => {
    try {
      await signOut();
      $("signout").hidden = true;
      message("Signed out successfully.");
    } catch (error) {
      message(error.message || "Sign-out failed.");
    }
  };
</script>
</body>
</html>
